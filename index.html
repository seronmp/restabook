        async function eseguiLogin(event) {
            if (event) event.preventDefault();

            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            if (!supabaseClient) {
                alert("Supabase non è ancora pronto. Riprova tra un secondo.");
                return;
            }

            const { data: authData, error: authError } = await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password
            });

            if (authError) {
                alert("Errore di login: " + authError.message);
                return;
            }

            const user = authData.user;

            document.getElementById('login-container').style.display = 'none';
            document.getElementById('app-container').style.display = 'block';

            if (email === 'admin@admin.com') {
                currentRestaurantId = 'tutti';
                currentRestaurantName = 'Admin Globale';
            } else {
                const { data: profile, error: profileError } = await supabaseClient
                    .from('profiles')
                    .select('restaurant_id, restaurant_name')
                    .eq('id', user.id)
                    .single();

                if (profileError || !profile) {
                    alert("Nessun profilo ristorante associato a questo utente.");
                    return;
                }

                currentRestaurantId = profile.restaurant_id;
                currentRestaurantName = profile.restaurant_name || 'SmartTable Manager';
            }

            const appTitle = document.getElementById('app-title');
            if (appTitle) {
                appTitle.innerText = currentRestaurantName;
            }

            initApp();
        }

        async function loadDataFromSupabase() {
            if (!currentRestaurantId || !supabaseClient) return;

            try {
                let queryTables = supabaseClient.from('tables').select('*');
                let queryBookings = supabaseClient.from('bookings').select('*');

                if (currentRestaurantId !== 'tutti') {
                    queryTables = queryTables.eq('restaurant_id', currentRestaurantId);
                    queryBookings = queryBookings.eq('restaurant_id', currentRestaurantId);
                }

                const { data: tablesData, error: tablesError } = await queryTables;
                if (tablesError) throw tablesError;

                tables = (tablesData || []).map(t => ({
                    id: t.id,
                    table_number: t.table_number,
                    seats: t.seats,
                    shape: t.shape,
                    pos_x: t.pos_x ?? 50,
                    pos_y: t.pos_y ?? 50,
                    rotation: t.rotation ?? 0,
                    room_id: t.room_id || 'sala-principale',
                    restaurant_id: t.restaurant_id
                }));

                const { data: bookingsData, error: bookingsError } = await queryBookings;
                if (bookingsError) throw bookingsError;

                bookings = (bookingsData || []).map(b => ({
                    id: b.id,
                    tableId: b.table_id,
                    date: b.date,
                    startTime: b.start_time.substring(0, 5),
                    endTime: b.end_time.substring(0, 5),
                    name: b.name,
                    guests: b.guests,
                    phone: b.phone
                }));

                renderRooms();
                renderCalendar();
                renderTables();
                renderDailySummary();
            } catch (err) {
                console.error("Errore caricamento Supabase:", err.message);
            }
        }

        function renderRooms() {
            const container = document.getElementById('rooms-tabs-container');
            if (!container) return;

            container.innerHTML = '';

            rooms.forEach(room => {
                const isActive = room.id === currentRoomId;
                const btn = document.createElement('button');
                btn.className = `px-4 py-2 rounded-xl text-xs font-bold transition shadow-sm ${isActive ? 'bg-indigo-600 text-white shadow-indigo-100' : 'bg-white text-gray-600 hover:bg-gray-100 border border-gray-200'}`;
                btn.innerText = room.name;
                btn.onclick = () => {
                    currentRoomId = room.id;
                    renderRooms();
                    renderTables();
                };
                container.appendChild(btn);
            });
        }

        function formatDateKey(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            const monthsIt = ["Gen", "Feb", "Mar", "Apr", "Mag", "Giu", "Lug", "Ago", "Set", "Ott", "Nov", "Dic"];
            const monthsDe = ["Jan", "Feb", "Mär", "Apr", "Mai", "Jun", "Jul", "Aug", "Sep", "Okt", "Nov", "Dez"];

            const monthLabel = document.getElementById('month-year-label');
            if (monthLabel) {
                monthLabel.innerText = `${currentLang === 'it' ? monthsIt[month] : monthsDe[month]} ${year}`;
            }

            const currentDateDisplay = document.getElementById('current-date-display');
            if (currentDateDisplay) {
                currentDateDisplay.innerText = currentDate.toLocaleDateString(
                    currentLang === 'it' ? 'it-IT' : 'de-DE',
                    { weekday: 'short', day: 'numeric', month: 'short' }
                );
            }

            const firstDayIndex = (new Date(year, month, 1).getDay() + 6) % 7;
            const totalDays = new Date(year, month + 1, 0).getDate();

            const daysContainer = document.getElementById('calendar-days');
            if (!daysContainer) return;

            daysContainer.innerHTML = '';
            renderDailySummary();

            for (let i = 0; i < firstDayIndex; i++) {
                daysContainer.innerHTML += `<div></div>`;
            }

            const selectedStr = formatDateKey(currentDate);

            for (let d = 1; d <= totalDays; d++) {
                const dateTest = new Date(year, month, d);
                const dateStr = formatDateKey(dateTest);
                const isSelected = dateStr === selectedStr;
                const hasBookings = bookings.some(b => b.date === dateStr);

                let btnClass = "h-8 w-8 mx-auto rounded-full flex items-center justify-center text-xs font-medium transition cursor-pointer relative ";
                if (isSelected) {
                    btnClass += "bg-indigo-600 text-white shadow-md";
                } else {
                    btnClass += "hover:bg-gray-100 text-gray-700";
                }

                daysContainer.innerHTML += `
                    <div onclick="selectDate(${year}, ${month}, ${d})">
                        <button class="${btnClass}">
                            ${d}
                            ${hasBookings && !isSelected ? '<span class=\"absolute bottom-1 w-1 h-1 bg-indigo-500 rounded-full\"></span>' : ''}
                        </button>
                    </div>
                `;
            }
        }

        function selectDate(year, month, day) {
            currentDate = new Date(year, month, day);
            renderCalendar();
            renderTables();
        }

        function changeMonth(direction) {
            currentDate.setMonth(currentDate.getMonth() + direction);
            renderCalendar();
        }

        function renderDailySummary() {
            const currentDateStr = formatDateKey(currentDate);
            const tbody = document.getElementById('daily-summary-list');
            const totalCountEl = document.getElementById('total-guests-count');
            const t = translations[currentLang];

            if (!tbody || !totalCountEl) return;

            const dayBookings = bookings
                .filter(b => b.date === currentDateStr)
                .sort((a, b) => a.startTime.localeCompare(b.startTime));

            tbody.innerHTML = '';
            let totalGuests = 0;

            if (dayBookings.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="py-4 text-center text-gray-400 italic">${t.noDailyBookings}</td></tr>`;
                totalCountEl.innerText = '0';
                return;
            }

            dayBookings.forEach(b => {
                totalGuests += b.guests;
                const tableObj = tables.find(t => t.id === b.tableId);
                const tableNum = tableObj ? tableObj.table_number : '-';

                tbody.innerHTML += `
                    <tr class="hover:bg-gray-50/80 transition">
                        <td class="py-3 px-3 font-bold text-indigo-600">${b.startTime} - ${b.endTime}</td>
                        <td class="py-3 px-3 font-semibold">T-${tableNum}</td>
                        <td class="py-3 px-3 font-medium text-gray-900">${b.name}</td>
                        <td class="py-3 px-3"><span class="bg-gray-100 px-2 py-0.5 rounded-md font-bold">${b.guests}</span></td>
                        <td class="py-3 px-3 text-gray-500">${b.phone || '-'}</td>
                        <td class="py-3 px-3 text-right">
                            <button onclick="deleteBooking('${b.id}')" class="text-rose-500 hover:text-rose-700 p-1.5 rounded-lg hover:bg-rose-50 transition" title="Elimina">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </td>
                    </tr>
                `;
            });

            totalCountEl.innerText = totalGuests;
        }

        function renderTables() {
            const canvas = document.getElementById('floor-canvas');
            if (!canvas) return;

            canvas.innerHTML = '';
            const currentDateStr = formatDateKey(currentDate);
            const timeFilter = document.getElementById('filter-time') ? document.getElementById('filter-time').value : 'all';

            const roomTables = tables.filter(t => (t.room_id || 'sala-principale') === currentRoomId);

            roomTables.forEach(table => {
                let tableBookings = bookings.filter(b => b.tableId === table.id && b.date === currentDateStr);

                if (timeFilter !== 'all') {
                    const [fStart, fEnd] = timeFilter.split('-');
                    tableBookings = tableBookings.filter(b => b.startTime < fEnd && b.endTime > fStart);
                }

                let statusColor = "bg-emerald-50 border-emerald-300 text-emerald-900";
                let badgeColor = "bg-emerald-500";
                let statusText = translations[currentLang].free;

                if (tableBookings.length > 0 && timeFilter === 'all') {
                    statusColor = "bg-amber-50 border-amber-300 text-amber-900";
                    badgeColor = "bg-amber-500";
                    statusText = `${tableBookings.length} ris.`;
                } else if (tableBookings.length > 0) {
                    statusColor = "bg-rose-50 border-rose-300 text-rose-900";
                    badgeColor = "bg-rose-500";
                    statusText = translations[currentLang].full;
                }

                const width = table.seats <= 2 ? 80 : table.seats <= 4 ? 110 : table.seats <= 8 ? 150 : Math.min(240, 110 + (table.seats * 6));
                const height = table.seats <= 8 ? 110 : 120;

                const shapeClass = table.shape === 'circle' ? 'rounded-full' : 'rounded-xl';
                const posX = table.pos_x ?? 50;
                const posY = table.pos_y ?? 50;
                const rotation = table.rotation ?? 0;

                const tableEl = document.createElement('div');
                tableEl.className = `absolute border-2 ${statusColor} ${shapeClass} p-3 flex flex-col justify-between shadow-sm transition-all select-none cursor-pointer hover:shadow-md`;
                tableEl.style.left = `${posX}px`;
                tableEl.style.top = `${posY}px`;
                tableEl.style.width = `${width}px`;
                tableEl.style.height = `${height}px`;
                tableEl.style.transform = `rotate(${rotation}deg)`;

                tableEl.innerHTML = `
                    <div class="flex justify-between items-start pointer-events-none">
                        <span class="text-xs font-black opacity-70">T-${table.table_number}</span>
                        <span class="w-2.5 h-2.5 ${badgeColor} rounded-full inline-block"></span>
                    </div>
                    <div class="text-center pointer-events-none my-auto">
                        <h3 class="text-lg font-black">${table.table_number}</h3>
                        <div class="text-[10px] opacity-80"><i class="fa-solid fa-user-group"></i> ${table.seats} p.</div>
                    </div>
                    <div class="text-[10px] font-bold text-center truncate pointer-events-none opacity-90">${statusText}</div>
                `;

                tableEl.addEventListener('click', () => {
                    if (!isEditMode) openTableModal(table.id);
                });

                if (isEditMode) {
                    tableEl.classList.add('cursor-move', 'ring-2', 'ring-indigo-400', 'ring-offset-2');
                    enableDrag(tableEl, table.id, width, height);
                }

                canvas.appendChild(tableEl);
            });
        }

        function enableDrag(element, tableId, width, height) {
            let isDragging = false;
            let startX;
            let startY;

            element.addEventListener('mousedown', (e) => {
                if (!isEditMode) return;
                isDragging = true;
                startX = e.clientX - element.offsetLeft;
                startY = e.clientY - element.offsetTop;
                element.style.zIndex = 1000;
                e.stopPropagation();
            });

            document.addEventListener('mousemove', (e) => {
                if (!isDragging || !isEditMode) return;
                const canvasRect = document.getElementById('floor-canvas').getBoundingClientRect();

                let newX = e.clientX - startX;
                let newY = e.clientY - startY;

                newX = Math.max(0, Math.min(newX, canvasRect.width - width - 10));
                newY = Math.max(0, Math.min(newY, canvasRect.height - height - 10));

                element.style.left = `${newX}px`;
                element.style.top = `${newY}px`;
            });

            document.addEventListener('mouseup', () => {
                if (isDragging) {
                    isDragging = false;
                    element.style.zIndex = 1;

                    const newX = parseInt(element.style.left);
                    const newY = parseInt(element.style.top);

                    const tableObj = tables.find(t => t.id === tableId);
                    if (tableObj) {
                        tableObj.pos_x = newX;
                        tableObj.pos_y = newY;
                        updateTableCoordinates(tableId, newX, newY);
                    }
                }
            });
        }
